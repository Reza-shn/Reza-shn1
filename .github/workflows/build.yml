name: Build APK

on:
  push:
    branches: [ main, master, notification-manager ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        env:
          BUILD_TOOLS_VERSION: 34.0.0
          PLATFORM: android-34
          # Optional: add these as repository secrets to keep the same signing key
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          [ -z "$KEYSTORE_PASS" ] && unset KEYSTORE_PASS KEY_ALIAS KEY_PASS KEYSTORE_BASE64
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotificationManager-apk
          path: dist/*.apk

      - name: Publish APK to apk-build branch
        run: |
          mkdir -p /tmp/out && cp dist/*.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
