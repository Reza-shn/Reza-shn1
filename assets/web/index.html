<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="author" content="PROTHOTECH">
  <title>Notification Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<main id="views">

  <!-- ======================================================= HOME -->
  <section class="view tab active" data-view="home">
    <header class="navbar">
      <span class="nav-side"></span>
      <span class="nav-title" data-t="home.title"></span>
      <span class="nav-side end">
        <button class="nav-btn" data-go="history" data-t-aria="nav.unread"><i data-ic="bell"></i><b class="badge hidden" id="badge"></b></button>
        <button class="nav-btn" data-push="settings" data-t-aria="settings.title"><i data-ic="gear"></i></button>
      </span>
    </header>
    <div class="content">
      <h1 class="large-title" data-t="home.title"></h1>
      <p class="large-sub" data-t="home.sub"></p>

      <div id="accessBanner"></div>

      <div class="hero glass">
        <div class="hero-top">
          <span class="status" id="statusPill"></span>
          <span class="hero-date" id="heroDate"></span>
        </div>
        <div class="hero-main">
          <div>
            <strong class="hero-num" id="todayNum">0</strong>
            <span class="hero-label" data-t="home.todayLabel"></span>
          </div>
          <svg class="spark" id="spark" viewBox="0 0 160 60" preserveAspectRatio="none"></svg>
        </div>
        <div class="hero-stats">
          <button data-go="stats"><b id="hsWeek">0</b><span data-t="home.week"></span></button>
          <button data-go="apps"><b id="hsApps">0</b><span data-t="home.wApps"></span></button>
          <button data-push="blocked"><b id="hsBlocked">0</b><span data-t="q.blocked"></span></button>
        </div>
      </div>

      <div class="actions glass">
        <button data-go="history"><i data-ic="clock"></i><span data-t="q.history"></span></button>
        <button data-push="blocked"><i data-ic="bellSlash"></i><span data-t="q.blocked"></span></button>
        <button data-action="test"><i data-ic="send"></i><span data-t="q.test"></span></button>
        <button data-action="clear"><i data-ic="trash"></i><span data-t="q.clear"></span></button>
      </div>

      <div class="sec-head"><span data-t="home.recent"></span><button class="link" data-go="history" data-t="common.seeAll"></button></div>
      <div class="group glass" id="homeRecent"></div>

      <div class="sec-head"><span data-t="home.apps"></span><button class="link" data-go="apps" data-t="common.seeAll"></button></div>
      <div class="group glass" id="homeApps"></div>
      <p class="sec-foot" data-t="home.appsFoot"></p>
    </div>
  </section>

  <!-- ======================================================= HISTORY -->
  <section class="view tab" data-view="history">
    <header class="navbar">
      <span class="nav-side"></span>
      <span class="nav-title" data-t="history.title"></span>
      <span class="nav-side end"><button class="nav-btn" data-action="historyMenu" data-t-aria="common.more"><i data-ic="more"></i></button></span>
    </header>
    <div class="content">
      <h1 class="large-title" data-t="history.title"></h1>
      <p class="large-sub" id="historySub"></p>
      <label class="search glass-soft"><i data-ic="search"></i><input id="historySearch" type="search" autocomplete="off" data-t-ph="history.search"></label>
      <div class="chips" id="historyChips"></div>
      <div id="historyList"></div>
      <div id="historyMore" class="list-foot"></div>
    </div>
  </section>

  <!-- ======================================================= STATS -->
  <section class="view tab" data-view="stats">
    <header class="navbar">
      <span class="nav-side"></span>
      <span class="nav-title" data-t="stats.title"></span>
      <span class="nav-side end"></span>
    </header>
    <div class="content">
      <h1 class="large-title" data-t="stats.title"></h1>
      <p class="large-sub" data-t="stats.sub"></p>
      <div class="tiles" id="statTiles"></div>
      <div class="sec-head"><span data-t="stats.week"></span></div>
      <div class="card glass"><div class="week-chart" id="weekChart"></div></div>
      <div class="sec-head"><span data-t="stats.hours"></span></div>
      <div class="card glass"><div class="hour-chart" id="hourChart"></div><div class="hour-axis" id="hourAxis"></div></div>
      <div class="sec-head"><span data-t="stats.top"></span></div>
      <div class="group glass" id="topApps"></div>
    </div>
  </section>

  <!-- ======================================================= APPS -->
  <section class="view tab" data-view="apps">
    <header class="navbar">
      <span class="nav-side"></span>
      <span class="nav-title" data-t="apps.title"></span>
      <span class="nav-side end"><button class="nav-text" data-action="appsMenu" data-t="common.edit"></button></span>
    </header>
    <div class="content">
      <h1 class="large-title" data-t="apps.title"></h1>
      <p class="large-sub" id="appsSub"></p>
      <label class="search glass-soft"><i data-ic="search"></i><input id="appsSearch" type="search" autocomplete="off" data-t-ph="apps.search"></label>
      <div class="segmented" id="appsSeg">
        <button data-f="all" data-t="apps.fAll"></button>
        <button data-f="enabled" data-t="apps.fOn"></button>
        <button data-f="disabled" data-t="apps.fOff"></button>
        <button data-f="user" data-t="apps.fUser"></button>
      </div>
      <div class="group glass" id="appsList"></div>
    </div>
  </section>

  <!-- ======================================================= BLOCKED (pushed) -->
  <section class="view page" data-view="blocked">
    <header class="navbar">
      <span class="nav-side"><button class="back" data-back><i data-ic="chevBack" class="flip"></i><span data-t="common.back"></span></button></span>
      <span class="nav-title" data-t="blocked.title"></span>
      <span class="nav-side end"></span>
    </header>
    <div class="content">
      <h1 class="large-title" data-t="blocked.title"></h1>
      <p class="large-sub" id="blockedSub"></p>
      <div class="card glass info" id="blockedInfo"></div>
      <label class="search glass-soft"><i data-ic="search"></i><input id="blockedSearch" type="search" autocomplete="off" data-t-ph="apps.search"></label>
      <div class="group glass" id="blockedList"></div>
    </div>
  </section>

  <!-- ======================================================= SETTINGS (pushed) -->
  <section class="view page" data-view="settings">
    <header class="navbar">
      <span class="nav-side"><button class="back" data-back><i data-ic="chevBack" class="flip"></i><span data-t="common.back"></span></button></span>
      <span class="nav-title" data-t="settings.title"></span>
      <span class="nav-side end"></span>
    </header>
    <div class="content">
      <h1 class="large-title" data-t="settings.title"></h1>
      <div id="settingsBody"></div>
    </div>
  </section>
</main>

<!-- ======================================================= TAB BAR -->
<nav class="tabbar glass-strong" id="tabbar">
  <span class="tab-pill" id="tabPill"></span>
  <button data-tab="home"><i data-ic="home"></i><span data-t="tab.home"></span></button>
  <button data-tab="history"><i data-ic="clock"></i><span data-t="tab.history"></span></button>
  <button data-tab="stats"><i data-ic="chart"></i><span data-t="tab.stats"></span></button>
  <button data-tab="apps"><i data-ic="apps"></i><span data-t="tab.apps"></span></button>
</nav>

<!-- ======================================================= OVERLAYS -->
<div class="scrim" id="scrim"></div>
<div class="sheet glass-strong" id="sheet" role="dialog" aria-modal="true"></div>
<div class="actionsheet" id="actionsheet" role="dialog" aria-modal="true"></div>
<div class="alert glass-strong" id="alert" role="alertdialog" aria-modal="true"></div>
<div class="hud glass-strong" id="hud"></div>

<script src="app.js"></script>
</body>
</html>
